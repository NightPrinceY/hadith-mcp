<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hadith Reader</title>
  <style>
    :root {
      --bg: #14110d;
      --surface: #1f1c17;
      --text: #f2ecdb;
      --muted: #a89c87;
      --accent: #5fc89a;
      --border: #3a3228;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf8f5;
        --surface: #ffffff;
        --text: #2c2418;
        --muted: #6b5e4e;
        --accent: #1a6b4a;
        --border: #d9d0c3;
      }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
    .shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.88rem;
    }
    .topbar .title { font-weight: 600; color: var(--text); flex: 1; }
    .topbar .status { color: var(--muted); font-size: 0.8rem; }
    .topbar a {
      color: var(--accent); text-decoration: none; font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .topbar a:hover { text-decoration: underline; }
    .frame-wrap { flex: 1; position: relative; background: var(--bg); }
    iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: 0;
      background: var(--bg);
    }
    .fallback {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 24px; text-align: center;
      background: var(--bg); color: var(--muted);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .fallback.visible { opacity: 1; pointer-events: auto; }
    .fallback .msg { max-width: 420px; line-height: 1.6; }
    .fallback a.open-btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      font-weight: 600;
    }
    @media (max-width: 560px) {
      .topbar { padding: 6px 10px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar" role="banner">
      <span class="title">Hadith Reader</span>
      <span id="status" class="status"></span>
      <a id="openBtn" target="_blank" rel="noopener" href="https://search.hadith-mcp.org/">
        Open in new tab ↗
      </a>
    </div>
    <div class="frame-wrap">
      <iframe
        id="frame"
        title="Hadith search"
        referrerpolicy="no-referrer"
        allow="clipboard-write"
        src="https://search.hadith-mcp.org/?app=1"
      ></iframe>
      <div id="fallback" class="fallback" aria-hidden="true">
        <p class="msg">
          The embedded reader could not load inside this host.<br>
          Open it in a new tab to browse the results.
        </p>
        <a id="fallbackOpen" class="open-btn" target="_blank" rel="noopener"
          href="https://search.hadith-mcp.org/">Open Hadith Search</a>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("frame");
      const openBtn = document.getElementById("openBtn");
      const fallback = document.getElementById("fallback");
      const fallbackOpen = document.getElementById("fallbackOpen");
      const statusEl = document.getElementById("status");

      let base = "https://search.hadith-mcp.org";
      let hasRenderedFromSdk = false;

      function buildUrl(data) {
        const u = new URL(base);
        u.searchParams.set("app", "1");
        if (data?.kind === "detail" && data.hadith?.id != null) {
          u.searchParams.set("id", String(data.hadith.id));
        } else if (data?.kind === "search" && data.query) {
          u.searchParams.set("q", data.query);
          if (data.collection_filter) {
            u.searchParams.set("collection", data.collection_filter);
          }
        }
        return u.toString();
      }

      function applyUrl(url) {
        if (!url) return;
        if (frame.src !== url) frame.src = url;
        openBtn.href = url;
        fallbackOpen.href = url;
      }

      // Detect obvious iframe failures (e.g. host CSP stripping cross-origin
      // frames). If the iframe never fires a load event, show the fallback.
      let loaded = false;
      frame.addEventListener("load", () => { loaded = true; fallback.classList.remove("visible"); });
      setTimeout(() => {
        if (!loaded) {
          fallback.classList.add("visible");
          statusEl.textContent = "Embed blocked";
        }
      }, 2500);

      // Try the MCP Apps SDK for richer integration. Optional — a plain iframe
      // to the default search URL already works without it.
      (async () => {
        try {
          const mod = await import("https://esm.sh/@modelcontextprotocol/ext-apps");
          const app = new mod.App({ name: "Hadith Reader", version: "0.2.0" });
          app.ontoolresult = (result) => {
            const sc = result?.structuredContent;
            if (!sc) return;
            if (sc.search_app_url) base = sc.search_app_url;
            hasRenderedFromSdk = true;
            applyUrl(buildUrl(sc));
          };
          app.onhostcontextchanged = () => {};
          app.onteardown = async () => ({ state: {} });
          await app.connect();
          statusEl.textContent = "Connected";
        } catch (err) {
          // SDK unavailable — the plain iframe fallback already handles this.
          statusEl.textContent = "";
          if (typeof console !== "undefined") {
            console.debug("[hadith-reader] SDK not available:", err?.message || err);
          }
        }
      })();
    })();
  </script>
</body>
</html>
