<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hadith Search</title>
  <meta name="description" content="Search hadith by meaning or direct IDs." />
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="top-nav" id="topNav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">hadith-search</a>
      <a href="https://hadith-mcp.org" target="_blank" rel="noopener" class="nav-link">hadith-mcp.org</a>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-inner">
      <p class="hero-badge">Model Context Protocol</p>
      <h1>Search Hadith with confidence.</h1>
      <p class="hero-sub">
        Semantic search plus direct lookup by DB ID or collection number.
      </p>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <section class="search-panel">
        <label for="searchInput">Search query</label>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="e.g. sleep difficulty, #6074, bukhari 6074" />
          <button id="searchBtn" class="btn btn-primary" type="button">Search</button>
          <button id="clearBtn" class="btn btn-outline" type="button">Clear</button>
        </div>
        <div class="filters-row">
          <label for="collectionSelect">Collection</label>
          <select id="collectionSelect">
            <option value="">All collections</option>
          </select>
        </div>
      </section>

      <section class="status-row">
        <p id="statsText" class="section-desc">Enter a query to start.</p>
      </section>

      <section id="resultsList" class="result-list" aria-live="polite"></section>

      <nav id="pagination" class="pagination" hidden>
        <button id="prevPageBtn" class="btn btn-outline" type="button">Previous</button>
        <span id="pageText"></span>
        <button id="nextPageBtn" class="btn btn-outline" type="button">Next</button>
      </nav>
    </div>
  </main>

  <template id="resultTemplate">
    <article class="result-card" tabindex="0">
      <header class="result-head">
        <div class="result-meta">
          <span class="chip chip-coll"></span>
          <span class="chip chip-num"></span>
          <span class="chip chip-chapter" hidden></span>
          <span class="chip chip-sim" hidden></span>
        </div>
        <div class="result-actions" role="group" aria-label="Hadith actions">
          <button class="icon-btn copy-link-btn" type="button" title="Copy share link" aria-label="Copy share link">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/>
              <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>
            </svg>
          </button>
          <button class="icon-btn copy-text-btn" type="button" title="Copy hadith text" aria-label="Copy hadith text">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <a class="icon-btn open-link" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </a>
        </div>
      </header>

      <p class="result-narrator" hidden></p>

      <div class="result-body">
        <div class="english-text"></div>
        <button class="expand-btn" type="button" hidden>Show more</button>
      </div>

      <div class="arabic-block" hidden>
        <p class="arabic-text" dir="rtl" lang="ar"></p>
      </div>

      <footer class="result-footer">
        <span class="chip chip-dbid"></span>
        <span class="chip chip-prov" hidden></span>
      </footer>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
